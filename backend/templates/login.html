<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
        <link rel="stylesheet" href="../static/style-auth.css">
        <script defer src="{{ url_for('static', filename='js/auth.js') }}"></script>
        <title>Login</title>
    </head>
    <body>
        
        <form id="form-login">
            <div class="container-principal">

                <div class="container-login">

                    <div class="container-titulo">
                        Login
                    </div>
                    
                    <div class="container-input">

                        <div class="container-placeholder" id="input-email">
                            <i class="fa-regular fa-user"></i>
                            <input type="email" name="email" placeholder="Email">
                        </div>

                        <div class="container-placeholder" id="input-senha">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" name="senha" placeholder="Senha">
                        </div>

                    </div>
                    <div class="container-retorno" >
                        <div class="retorno-dados-incorretos" id="retorno-dados-incorretos">
                                
                        </div>
                    </div>

                    <div class="container-botao">
                        <button id="botao-login" onclick="logar(event)">Login</button>
                    </div>
                    <div class="link-cadastro">
                        <p>não tem uma conta? <a href="{{ url_for('views.cadastro') }}">crie uma</a></p>
                    </div>

                </div>

            </div>

        </form>

    </body>
</html>
